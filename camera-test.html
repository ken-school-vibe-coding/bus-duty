<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Camera Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Camera Test">
<meta name="theme-color" content="#0b0b0c">
<style>
  html,body{margin:0;height:100%;background:#0b0b0c;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  body{display:flex;flex-direction:column;align-items:center;gap:16px;
    padding:calc(env(safe-area-inset-top) + 16px) 16px 16px;}
  h1{font-size:20px;margin:0;}
  video{width:100%;max-width:520px;background:#000;border-radius:12px;
    border:2px solid #3c4048;}
  #status{font-size:20px;font-weight:800;text-align:center;padding:12px 16px;
    border-radius:12px;width:100%;max-width:520px;box-sizing:border-box;}
  .ok{background:#123f27;color:#37d67a;border:2px solid #37d67a;}
  .err{background:#3f1616;color:#ff6b6b;border:2px solid #ff6b6b;
    white-space:pre-wrap;word-break:break-word;}
  .wait{background:#1b1c1f;color:#9aa0a6;border:2px solid #3c4048;}
  button{font:inherit;font-size:18px;font-weight:700;min-height:56px;
    padding:10px 20px;border-radius:12px;border:2px solid #ffd400;
    background:#ffd400;color:#0b0b0c;}
  small{color:#9aa0a6;text-align:center;max-width:520px;}
</style>
</head>
<body>
  <h1>Camera Test</h1>
  <video id="preview" playsinline muted autoplay></video>
  <div id="status" class="wait">Requesting camera…</div>
  <button id="retry" hidden>Try again</button>
  <small>Add this page to your Home Screen and launch it from the icon to confirm
  the camera opens in standalone mode. HTTPS is required — it will not work over a
  plain <code>file://</code> or <code>http://</code> URL.</small>

<script>
  const video  = document.getElementById("preview");
  const status = document.getElementById("status");
  const retry  = document.getElementById("retry");
  let stream = null;

  function setStatus(cls, text){ status.className = cls; status.textContent = text; }

  async function start(){
    setStatus("wait", "Requesting camera…");
    retry.hidden = true;

    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      setStatus("err", "getUserMedia is not available in this browser/context.\n"
        + "(Usually means the page is not being served over HTTPS.)");
      retry.hidden = false;
      return;
    }

    try{
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } },
        audio: false
      });
      video.srcObject = stream;
      await video.play().catch(() => {});
      const track = stream.getVideoTracks()[0];
      const label = track && track.label ? " — " + track.label : "";
      setStatus("ok", "Camera working" + label);
    }catch(err){
      setStatus("err", (err && err.name ? err.name + ": " : "") + (err && err.message ? err.message : String(err)));
      retry.hidden = false;
    }
  }

  retry.addEventListener("click", start);

  // Re-acquire the stream when returning to a backgrounded standalone app.
  document.addEventListener("visibilitychange", () => {
    if(!document.hidden){
      const live = stream && stream.getVideoTracks().some(t => t.readyState === "live");
      if(!live) start(); else video.play().catch(() => {});
    }
  });

  start();
</script>
</body>
</html>
